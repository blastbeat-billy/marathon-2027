name: Update fundraising and miles totals

on:
  schedule:
    # Runs at 00:23, 06:23, 12:23 and 18:23 UTC every day
    - cron: "23 */6 * * *"
  workflow_dispatch: {} # lets you run it manually with a button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the website files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest totals
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node scripts/update-data.js

      - name: Save the new numbers (if they changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Nothing changed - no update needed."
          else
            git commit -m "Update fundraising and miles totals"
            git push
          fi
