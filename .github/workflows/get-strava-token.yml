name: Get Strava refresh token (one-time helper)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "The code copied from the address bar after approving on Strava"
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code for tokens
        env:
          CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          RESPONSE=$(curl -s -X POST https://www.strava.com/oauth/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d code="$CODE" \
            -d grant_type=authorization_code)
          echo "=============================================="
          echo "Copy the value below into a repository secret"
          echo "named STRAVA_REFRESH_TOKEN, then delete this"
          echo "workflow file and this run's logs."
          echo "=============================================="
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('refresh_token:', d.get('refresh_token') or ('ERROR: ' + json.dumps(d)))"
